[package]
name = "anyx-fd"
version.workspace = true
edition.workspace = true
description = "Finds files by name, as fd does, as an anyx protocol tool"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "anyx-fd"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
regex = "1"
# For the code generated from `fd.anyx`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
anyx-core-generate = { path = "../anyx-core-generate", version = "0.1.0" }

[dev-dependencies]
anyx-core-generate = { path = "../anyx-core-generate", version = "0.1.0" }
anyx-shell = { path = "../anyx-shell", version = "0.1.0" }
tempfile = "3"
